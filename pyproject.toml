[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-utils-colab"
version = "0.1.0"
description = "Colab/Drive utilities for service-account based access"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client",
    "google-auth",
]

[project.optional-dependencies]
colab = ["ipywidgets"]

[tool.setuptools.packages.find]
where = ["."]
